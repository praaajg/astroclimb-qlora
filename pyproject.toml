[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astroclimb-qlora"
version = "1.0.0"
description = "QLoRA fine-tuning of Gemma 4 E4B for AstroCLIMB citation-relation linking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Prajwal Ghimire" },
    { name = "Shiv Ram Saud" },
    { name = "Aashish Mahato" },
    { name = "Sandeep Dawadi" },
    { name = "Ramesh Saud" },
    { name = "Sunil Regmi" },
    { name = "Manoj Shakya" },
]
keywords = [
    "astroclimb",
    "wasp2026",
    "multimodal",
    "vision-language",
    "qlora",
    "lora",
    "gemma",
    "citation-graph",
    "astronomy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "peft>=0.13",
    "accelerate>=0.34",
    "datasets>=2.20",
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
astroclimb-train = "astroclimb.train:main"
astroclimb-infer = "astroclimb.infer:main"
astroclimb-evaluate = "astroclimb.evaluate:main"

[project.urls]
Homepage = "https://github.com/praaajg/astroclimb-qlora"
Paper = "https://github.com/praaajg/astroclimb-qlora/blob/main/paper/2026.wasp-1.21.pdf"
Adapter = "https://huggingface.co/ShivRamSaud/gemma4-e4b-qlora-astroclimb-v2-fresh"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/astroclimb/prompt.py" = ["E501"]
